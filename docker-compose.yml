services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manpower}
      POSTGRES_USER: ${POSTGRES_USER:-manpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manpower_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manpower} -d ${POSTGRES_DB:-manpower}"]
volumes:
  postgres_data:

